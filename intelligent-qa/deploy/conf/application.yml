server:
  port: 9910
spring:
  datasource:
    url: jdbc:postgresql://47.94.1.34:54321/kingbase
    username: kingbase
    password: caeit123
    driver-class-name: org.postgresql.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  production: false
  basic:
    enable: false
  setting:
    language: zh-CN

lazycraft:
  base-url: http://localhost:30382
  app-id: 9f933b08-a757-4704-b291-e16c63d2f61c

# 文件存储配置
# file.storage.type: seaweed  => 使用 SeaweedFS（默认）
# file.storage.type: local    => 使用本地文件系统
file:
  storage:
    type: seaweed            # seaweed | local
    local:
      path: ./uploads        # 本地存储目录（type=local 时生效）
      base-url: ""           # 文件访问 URL 前缀，留空则使用 /api/system/files/{fileId}/download

seaweedfs:
  master-url: http://127.0.0.1:9333

auth:
  use-fixed-admin: true   # 本地调试用，生产环境保持 false 或不配置

